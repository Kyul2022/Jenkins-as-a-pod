apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      containers:
      - name: jenkins
        image: jenkins/jenkins:jdk21
        ports:
        - name: http-port
          containerPort: 8080 # pour l'interface web
        - name: jnlp-port
          containerPort: 5000 
        volumeMounts:
        - name: jenkins-vol
          mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-vol
          persistentVolumeClaim:
            claimName: jenkins-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-service-internal
  namespace: jenkins
spec:
  selector:
    app: jenkins
  ports:
  - name : jnlp
    port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-service-external
  namespace: jenkins
spec:
  type: LoadBalancer
  selector:
    app: jenkins
  ports:
  - name: http
    port: 8080
    targetPort: 8080


